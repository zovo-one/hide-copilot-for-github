<?xml version="1.0" encoding="UTF-8"?>
<!-- Hide Copilot for GitHub — original Zovo-branded icon.
     No copyrighted logos (no GitHub Octocat, no Copilot sparkle logo).
     A 4-point sparkle mark (the generic "AI magic" shape) struck through
     with a diagonal "no" line, on a Zovo purple rounded square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#5A4BD1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Generic 4-point sparkle (NOT the Copilot logo — a common "magic" mark) -->
  <path d="M64 30
           C 66 48, 80 62, 98 64
           C 80 66, 66 80, 64 98
           C 62 80, 48 66, 30 64
           C 48 62, 62 48, 64 30 Z"
        fill="#FFFFFF" opacity="0.96"/>
  <!-- Smaller secondary sparkle (top-right) -->
  <path d="M92 22
           C 93 28, 97 32, 103 33
           C 97 34, 93 38, 92 44
           C 91 38, 87 34, 81 33
           C 87 32, 91 28, 92 22 Z"
        fill="#FFFFFF" opacity="0.78"/>
  <!-- Diagonal "no" strike-through (the "hide" gesture) -->
  <line x1="24" y1="104" x2="104" y2="24"
        stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" opacity="0.95"/>
</svg>
